<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E8E1D5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Owly">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Owly — дневник чтения</title>
<style>html,body{margin:0;background:#E8E1D5;-webkit-text-size-adjust:100%}</style>
</head>
<body>
<div id="root"></div>
<script>
// older Safari: small polyfill
if (!Object.hasOwn) Object.hasOwn = function (o, k) { return Object.prototype.hasOwnProperty.call(o, k); };
// if the app fails to start, show why instead of a blank page
(function () {
  var errs = [];
  function show() {
    var r = document.getElementById("root"); if (!r || r.children.length) return;
    r.innerHTML = '<div style="font:15px/1.5 -apple-system,sans-serif;color:#4C362D;padding:32px 24px;max-width:560px;margin:0 auto">'
      + '<h2 style="margin:0 0 12px">Owly не запустилась</h2>'
      + '<p>Сделай скриншот этого экрана и пришли его.</p>'
      + '<pre style="white-space:pre-wrap;background:#F3EDE3;padding:12px;border-radius:10px;font-size:12px">' + (errs.join("\n") || "нет сообщений об ошибке").replace(/</g, "&lt;") + "\n\n" + navigator.userAgent + '</pre>'
      + '<p><button id="owly-reset" style="font:inherit;padding:10px 16px;border-radius:10px;border:1px solid #A8644A;background:#A8644A;color:#fff">Обновить приложение</button></p>'
      + '<p style="font-size:13px;color:#7A6458">Записи хранятся на устройстве и при обновлении не удаляются.</p></div>';
    document.getElementById("owly-reset").onclick = function () {
      var done = function () { location.replace(location.pathname + "?r=" + Date.now()); };
      var jobs = [];
      if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (x) { return x.unregister(); })); }));
      if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
      Promise.all(jobs).then(done, done);
    };
  }
  window.addEventListener("error", function (e) { errs.push((e.message || "error") + (e.filename ? " @ " + e.filename.split("/").pop() + ":" + e.lineno : "")); setTimeout(show, 300); });
  window.addEventListener("unhandledrejection", function (e) { errs.push("promise: " + (e.reason && (e.reason.message || e.reason))); });
  setTimeout(show, 8000);
})();
</script>
<script src="owly-config.js?v=202611211329"></script>
<script src="app.js?v=202611211329"></script>
</body>
</html>
